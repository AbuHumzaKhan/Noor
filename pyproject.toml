[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noor"
version = "0.4.0"
description = "Noor — an autonomous, safety-aware AI development and analytics automation partner"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
analytics = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "xlrd>=2.0",
    "odfpy>=1.4",
    "lxml>=5.0",
    "tables>=3.10",
    "pyreadstat>=1.2",
    "scipy>=1.13",
    "fastavro>=1.9",
]
data-engines = [
    "duckdb>=1.0",
    "polars>=1.0",
    "great-expectations>=1.0",
]
native-excel = ["pywin32>=306"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
noor-web = "noor.web:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
